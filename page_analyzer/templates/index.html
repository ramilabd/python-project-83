{% extends "base.html" %}

{% block content %}
<div class="max-w-5xl mx-auto px-4 pb-12">
  <div class="bg-gray-50 rounded-lg p-10">
    <h1 class="text-5xl font-medium text-gray-900">Анализатор страниц</h1>
    <p class="mt-3 text-gray-600">Бесплатно проверяйте сайты на SEO-пригодность</p>

    <form action="{{ url_for('add_url') }}" method="post" class="mt-6 flex gap-3">
      <div class="flex-1">
        <input type="text" name="url" value="{{ url or '' }}" placeholder="https://www.example.com"
               class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500
               {{ 'border-red-500' if errors and errors.url }}">
        {% if errors and errors.url %}
          <p class="mt-1 text-sm text-red-600" role="alert">{{ errors.url }}</p>
        {% endif %}
      </div>
      <button type="submit"
              class="rounded-md bg-blue-600 px-6 py-2 text-white font-medium uppercase hover:bg-blue-700 self-start">
        Проверить
      </button>
    </form>
  </div>
</div>
{% endblock %}
