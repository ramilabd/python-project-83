<!doctype html>
<html lang="ru" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Анализатор страниц{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="h-full flex flex-col bg-white">

  <header class="bg-gray-900">
    <nav class="max-w-5xl mx-auto px-4 py-4 flex items-center gap-6">
      <a href="{{ url_for('index') }}" class="text-white font-medium">Анализатор страниц</a>
      <a href="#" class="text-gray-400 hover:text-white">Сайты</a>
    </nav>
  </header>

  <main class="flex-1">
    <div class="max-w-5xl mx-auto px-4 pt-6">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div role="alert" class="mb-4 px-4 py-3 rounded
                        {{ 'bg-green-100 text-green-800' if category == 'success' else 'bg-red-100 text-red-800' }}">
              {{ message }}
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}
    </div>

    {% block content %}{% endblock %}
  </main>

  <footer class="border-t mt-12">
    <div class="max-w-5xl mx-auto px-4 py-6 text-center text-sm">
      <a href="https://ru.hexlet.io" class="text-blue-600 hover:underline">Hexlet</a>
    </div>
  </footer>

</body>
</html>
